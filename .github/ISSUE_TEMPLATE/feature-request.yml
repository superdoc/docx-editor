name: Feature Request
description: Suggest a new feature or improvement
labels:
  - "stage: triage"
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Community contributions start with issues. Pull requests are limited to repository collaborators.
        [Read why and how to contribute](https://github.com/superdoc/docx-editor/blob/main/CONTRIBUTING.md).
        Report suspected security vulnerabilities privately through [GitHub Security Advisories](https://github.com/superdoc/docx-editor/security/advisories/new), not in a public issue.
        Remove confidential information from any files, screenshots, or logs you share.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
      placeholder: |
        I'm trying to [do X] but SuperDoc doesn't support [Y] yet.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? Include code examples or mockups if helpful.
      placeholder: |
        It would be great if SuperDoc could...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, sample files, links to related issues, etc.
