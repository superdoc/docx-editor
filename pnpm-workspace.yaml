overrides:
  canvas: '3.2.3'
  happy-dom: '20.4.0'
  jsdom: '27.3.0'
  vue: '3.5.32'
  '@vue/compiler-core': '3.5.32'
  '@vue/compiler-dom': '3.5.32'
  '@vue/compiler-sfc': '3.5.32'
  '@vue/runtime-core': '3.5.32'
  '@vue/runtime-dom': '3.5.32'
  '@vue/server-renderer': '3.5.32'
  '@vue/shared': '3.5.32'
  # NOT aliased to the Vite+ core. `@voidzero-dev/vite-plus-core` publishes no
  # `bin`, so overriding every package to it removes the `vite` executable that
  # Examples invoke from their `dev` and `build` scripts. Packages that build
  # through Vite+ get it from `vite-plus` in their own devDependencies.
  vite: '^7.2.7'
  axios: '1.18.0'
  protobufjs@7: '7.6.4'
  protobufjs@8: '8.6.4'
  superdoc: 'workspace:*'
  '@superdoc/react': 'workspace:*'
  '@superdoc/sdk': '2.11.0-next.9'
  '@superdoc/common': 'workspace:*'
  '@superdoc/contracts': 'workspace:*'
  '@superdoc/dom-contract': 'workspace:*'
  '@superdoc/font-system': 'workspace:*'
  '@superdoc/font-utils': 'workspace:*'
  '@superdoc/geometry-utils': 'workspace:*'
  '@superdoc/layout-bridge': 'workspace:*'
  '@superdoc/layout-engine': 'workspace:*'
  '@superdoc/layout-resolved': 'workspace:*'
  '@superdoc/measuring-dom': 'workspace:*'
  '@superdoc/painter-dom': 'workspace:*'
  '@superdoc/preset-geometry': 'workspace:*'
  '@superdoc/style-engine': 'workspace:*'
  '@superdoc/url-validation': 'workspace:*'
  '@superdoc/word-layout': 'workspace:*'
  '@hocuspocus/provider': '^2.13.6'
  '@liveblocks/client': '^3.15.5'
  '@liveblocks/yjs': '^3.15.5'
  '@types/minimatch': '5.1.2'
  xml-js: '1.6.11'
  y-websocket: '^3.0.0'
  yjs: '^13.6.19'
  '@superdoc/cli>yjs': '13.6.31'
  vitest: 'catalog:'
# Vite+ ships its Vite fork as vite-plus-core 0.2.x under the `vite` alias, so
# no plugin's `^7 || ^8` peer range can match it. Pin the exact versions we
# actually resolve instead of waiving the ranges wholesale, so every other peer
# mismatch still surfaces at install time.
peerDependencyRules:
  allowedVersions:
    vite: 0.2.7
    vitest: 4.1.10
minimumReleaseAgeExclude:
  - '@superdoc/docx-engine@0.12.0 || 0.12.1-next.1 || 0.12.1-next.2 || 0.13.0-next.1 || 0.13.0-next.2 || 0.13.0-next.3 || 0.13.0-next.4 || 0.13.0-next.5 || 0.13.0-next.6 || 0.13.0-next.7'
